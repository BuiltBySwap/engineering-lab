site_name: Engineering Lab
site_description: Deep dives into Android internals, system design, backend and AI — learning in public.
site_url: https://builtbyswap.github.io/engineering-lab/
repo_url: https://github.com/BuiltBySwap/engineering-lab
repo_name: BuiltBySwap/engineering-lab

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search
  - literate-nav
  - mkdocs-jupyter:
      include_source: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/home-search.js

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ["docs"]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - hooks/kotlin_cells.py
