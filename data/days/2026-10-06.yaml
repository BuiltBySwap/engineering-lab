mq:
- id: MQ337
  category: Kotlin & Coroutines Runtime
  question: How does a suspend function pause without blocking a thread?
  status: done
  guess: Each suspended task is stored as a label; when the work completes the matching coroutine is found and returns to the same dispatcher.
  answer: Before suspending, the coroutine saves its progress (label + local variables) in a continuation object on the heap, and the function returns COROUTINE_SUSPENDED so the thread is free. When the awaited work finishes it calls continuation.resume(); the dispatcher picks a thread and the function re-enters at the saved label.
