mq:
- id: MQ421
  category: Mobile Backend & Sync
  question: How does a server stream AI tokens to a phone (SSE)?
  status: partial
  guess: ''
  answer: 'Keep the HTTP response open and send pieces as they are produced: Server-Sent Events (Content-Type: text/event-stream, no Content-Length, `data: ...` events each ending with a blank line). The phone reads the stream incrementally (OkHttp SSE or Ktor client, exposed as a Flow). SSE fits one-way token flow better than a WebSocket; cancelling the Flow closes the connection so the server stops paying for tokens. (Answer from the tutor: write your own version.)'
