mq:
- id: MQ422
  category: Mobile Backend & Sync
  question: How does a WebSocket server scale to a million phones?
  status: partial
  guess: ''
  answer: 'A WebSocket server holds one open connection per phone. Assume 10 to 50 KB each, so 1,000,000 connections need 10 to 50 GB of memory; one machine holds tens to hundreds of thousands (file descriptors, memory), so about 10 servers, or 20 with headroom. A shared layer such as Redis pub/sub routes a message to the server that holds the user''s connection. When a server dies its phones reconnect together, so use random delay (jitter) to avoid a reconnect storm, and tune heartbeats for battery vs detecting dead connections. (Answer from the tutor: write your own version.)'
