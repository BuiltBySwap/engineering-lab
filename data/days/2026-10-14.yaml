  feedback:
  - 'Words taught: extensible = easy to add to without rewriting; resilient = recovers quickly from failure. Grammar: past simple = a finished action at a specific past time (''I built the server yesterday''); present perfect = have/has + past participle for a past action connected to now (''I have built three endpoints this week''). Signals: yesterday, ago, last week, in 2024 -> past simple; already, yet, ever, never, just, so far, this week -> present perfect. Never ''I have built it yesterday''. Own three sentences still to write.'
