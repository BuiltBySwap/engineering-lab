  category: Mobile Backend & Sync
  question: How does a backend know which devices belong to a user for push?
  status: done
  guess: Each device has its own FCM token; after login the app sends it to the backend, mapped to the user ID; when the token changes the server updates it; the server pushes using that token.
  answer: 'Keep a `devices` table (many devices per user): upsert on onNewToken, delete on logout, delete when FCM reports the token UNREGISTERED, send to every token of the user; use topics for broadcasts.'
