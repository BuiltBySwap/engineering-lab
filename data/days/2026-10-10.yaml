mq:
- id: MQ4
  category: Boot Process
  question: How does the Linux kernel initialize Android?
  status: partial
  guess: ''
  answer: 'Boot loader hands the kernel, a ramdisk (containing init), the device tree and the command line to memory and jumps to the kernel. The kernel sets up memory, CPUs, the scheduler and drivers (including Android''s Binder driver), mounts the ramdisk, then starts /init as PID 1. (Answer from the tutor: write your own version.)'
- id: MQ5
  category: Boot Process
  question: How does init start Android services?
  status: partial
  guess: ''
  answer: 'init (PID 1) reads the init.rc files, written in Android''s init language: actions (on <trigger>), commands (mount, mkdir, setprop) and services. To start a service it creates a process and runs the program; if the service dies it restarts it (unless oneshot), and a critical service that keeps crashing can make init reboot the device. The zygote service has --start-system-server, so after preloading Zygote forks system_server. (Answer from the tutor: write your own version.)'
