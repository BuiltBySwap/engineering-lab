mq:
- id: MQ116
  category: Notifications
  question: How does Android receive push notifications?
  status: done
  guess: Android uses FCM to register each device with an FCM token.
  answer: Google Play services keeps ONE shared, long-lived connection to Google. The server calls FCM with the token, FCM pushes the message down that connection, and Play services hands it to the app, waking it if needed. The app only registers and gets a token.
- id: MQ117
  category: Notifications
  question: Why do notifications arrive instantly?
  status: done
  guess: Even if the app is closed, FCM registers the device and the notification is sent to the device.
  answer: It is instant because the connection is already open (no polling) and owned by Play services, a separate process that stays alive and starts the app only when a message arrives. One shared connection costs far less battery than one socket per app.
