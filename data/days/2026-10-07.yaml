mq:
- id: MQ317
  category: Production Questions
  question: How does WhatsApp retry sending messages after reconnecting?
  status: done
  guess: Queue unsent messages in Room with a timestamp; a network listener tells the app the internet is back; a message ID plus a server copy prevents duplicates; clock = not sent, one tick = server, two ticks = read.
  answer: 'Write EVERY message to Room first (outbox) with a client-generated UUID and status PENDING. A sender drains it over the socket, or WorkManager with a network constraint if the app was killed, retrying with backoff + jitter. The server dedupes by message ID and assigns a per-chat sequence number. Ticks are acknowledgements: server ACK = one tick, delivery receipt = grey double tick, read receipt = blue.'
