name: Check notebooks

# Runs every code cell of every notebook (Python and Kotlin, including the cells that download libraries).
# A green tick means the code in the book runs. A red cross shows which cell failed.

on:
  push:
    branches: [main]
    paths: ["docs/topics/**", "tools/**", "requirements*.txt", ".github/workflows/check.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  run-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pip install numpy matplotlib pyyaml
      - run: python tools/check_notebooks.py --kotlin --online
